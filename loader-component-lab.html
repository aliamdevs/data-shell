<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Shell - Loader Component</title>
</head>

<body>
    <div data-shell="loader large;loader t1 thin;loader t1 normal;loader t1 small;loader -l -w 20 -h 20 -b 2px"
        style="width: 100%;height: 130px;display: flex;justify-content: center;align-items: center;column-gap: 10px;">
    </div>

    <span data-shell="loader type-2 large;loader t2 thin;loader t2 normal;loader t2 small;loader t2 -w 20 -h 20 -b 2px"
        style="width: 100%;height: 130px;display: flex;justify-content: center;align-items: center;column-gap: 10px;">
    </span>

    <section
        data-shell="loader type-3 large;loader t3 thin;loader t3 normal;loader t3 small;loader type-3 small -b 6 -s 4000;"
        style="width: 100%;height: 130px;display: flex;justify-content: center;align-items: center;column-gap: 10px;">
    </section>

    <div data-shell="loader type-4 large;loader load thin;loader t4 normal;loader loading small;loader type-4 small -b 6 -s 4000;"
        style="width: 100%;height: 130px;display: flex;justify-content: center;align-items: center;column-gap: 10px;">
    </div>

    <div data-shell="
    
    loader type-5 large;
    loader moon thin;
    loader t5 normal;
    loader t5 small;
    loader type-5 small -b 6 -s 4000;
    
    " style="width: 100%;height: 130px;display: flex;justify-content: center;align-items: center;column-gap: 10px;">
    </div>

    <div data-shell="
    
    loader type-6 large;
    loader scroll thin;
    loader t6 normal -b 3;
    loader t6 small;
    loader type-6 small -b 2 -s 4000;
    
    " style="width: 100%;height: 130px;display: flex;justify-content: center;align-items: center;column-gap: 10px;">
    </div>

    <script src="./js/data-shell.js"></script>
</body>

</html>
